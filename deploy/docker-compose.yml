services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: vit_api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: ${DB_HOST:-64.226.97.116}
      DB_PORT: 5432
      DB_USERNAME: vit_admin
      DB_DATABASE: vit_platform
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      GPS_INGEST_SECRET: ${GPS_INGEST_SECRET:-}
      GPS_INGEST_COMMAND_URL: ${GPS_INGEST_COMMAND_URL:-http://gps-ingest:9088}
      TRACKING_SIMULATE_ENABLED: ${TRACKING_SIMULATE_ENABLED:-false}
    ports:
      - "${API_PORT:-4000}:3000"
    volumes:
      # Private APK store (auth-gated downloads; not served by nginx)
      - /var/www/vit-app-private:/var/www/vit-app-private:ro
      - /var/www/vit-app-private-staging:/var/www/vit-app-private-staging:ro
      # Optional: enable Docker container stats on /platform/ops/host
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - postgres_password
      - jwt_secret
      - jwt_refresh_secret
      - bootstrap_token
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/v1/health', (r) => { r.on('data', () => {}); r.on('end', () => process.exit(r.statusCode === 200 ? 0 : 1)); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gps-ingest:
    build:
      context: ../gps-ingest
      dockerfile: Dockerfile
    container_name: vit_gps_ingest
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:3000
      GPS_INGEST_SECRET: ${GPS_INGEST_SECRET:-}
      TRACKING_TCP_BIND: 0.0.0.0
      TRACKING_TCP_PORT: 5023
      MICODUS_TCP_BIND: 0.0.0.0
      MICODUS_TCP_PORT: 7700
      HEALTH_PORT: 9088
      INGEST_FLUSH_MS: ${INGEST_FLUSH_MS:-5000}
      INGEST_MAX_INFLIGHT: ${INGEST_MAX_INFLIGHT:-20}
    # 5023 + health: localhost only. 7700: public for cellular Micodus units.
    ports:
      - "127.0.0.1:${GPS_INGEST_HEALTH_PORT:-9088}:9088"
      - "127.0.0.1:${GPS_INGEST_TCP_PORT:-5023}:5023"
      - "${MICODUS_PUBLIC_BIND:-0.0.0.0}:${MICODUS_TCP_PORT:-7700}:7700"
    depends_on:
      - api

  system-admin:
    build:
      context: ../system-admin
      dockerfile: Dockerfile
      args:
        API_URL: http://api:3000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.2.8}
    container_name: vit_system_admin
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    ports:
      - "${SYSTEM_ADMIN_PORT:-4001}:3001"
    depends_on:
      - api

  tenant-admin:
    build:
      context: ../tenant-admin
      dockerfile: Dockerfile
      args:
        API_URL: http://api:3000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.2.8}
    container_name: vit_tenant_admin
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    ports:
      - "${TENANT_ADMIN_PORT:-4002}:3002"
    depends_on:
      - api

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret.txt
  bootstrap_token:
    file: ./secrets/bootstrap_token.txt

